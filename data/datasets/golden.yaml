- id: A01
  type: answerable
  question: What are the four functions of the NIST AI Risk Management Framework core?
  answer: GOVERN, MAP, MEASURE and MANAGE.
  sources:
  - file: nist-ai-rmf-1.0.pdf
    page: 8
- id: A02
  type: answerable
  question: Which characteristics of trustworthy AI systems does AI RMF 1.0 list?
  answer: Valid and reliable, safe, secure and resilient, accountable and transparent, explainable and
    interpretable, privacy enhanced, and fair with harmful biases managed.
  sources:
  - file: nist-ai-rmf-1.0.pdf
    page: 7
  - file: nist-ai-rmf-1.0.pdf
    page: 8
- id: A03
  type: answerable
  question: In which month and year was AI RMF 1.0 published?
  answer: January 2023.
  sources:
  - file: nist-ai-rmf-1.0.pdf
    page: 2
- id: A05
  type: answerable
  question: What are the six functions of NIST CSF 2.0?
  answer: GOVERN, IDENTIFY, PROTECT, DETECT, RESPOND and RECOVER.
  sources:
  - file: nist-csf-2.0.pdf
    page: 8
  - file: nist-csf-2.0.pdf
    page: 9
- id: A06
  type: answerable
  question: On what date was CSF 2.0 released?
  answer: February 26, 2024.
  sources:
  - file: nist-csf-2.0.pdf
    page: 1
- id: A07
  type: answerable
  question: What are the four groups of practices in the Secure Software Development Framework (SSDF)
    version 1.1?
  answer: Prepare the Organization (PO), Protect the Software (PS), Produce Well-Secured Software (PW)
    and Respond to Vulnerabilities (RV).
  sources:
  - file: nist-sp-800-218-ssdf.pdf
    page: 13
- id: A08
  type: answerable
  question: What is the control objective of identity assurance level IAL1 in NIST SP 800-63-4?
  answer: To limit highly scalable attacks, protect against synthetic identity, and protect against attacks
    that use compromised personal information.
  sources:
  - file: nist-sp-800-63-4.pdf
    page: 45
- id: A09
  type: answerable
  question: What does authenticator assurance level AAL2 provide?
  answer: High confidence that the claimant controls one or more authenticators bound to the subscriber
    account.
  sources:
  - file: nist-sp-800-63-4.pdf
    page: 46
- id: A10
  type: answerable
  question: How does the Generative AI Profile define confabulation?
  answer: The production of confidently stated but erroneous or false content.
  sources:
  - file: nist-ai-600-1-genai-profile.pdf
    page: 8
