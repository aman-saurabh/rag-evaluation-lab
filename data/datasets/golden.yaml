- id: M06
  type: multi_document
  question: Which framework has four practice groups and which framework has four core functions?
  answer: The SSDF has four practice groups (PO, PS, PW, RV). The AI RMF has four core functions (GOVERN,
    MAP, MEASURE, MANAGE).
  sources:
  - file: nist-sp-800-218-ssdf.pdf
    page: 13
  - file: nist-ai-rmf-1.0.pdf
